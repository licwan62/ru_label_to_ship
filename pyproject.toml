[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-label-to-ship"
version = "0.1.0"
description = "Ozon 标签解析、精确匹配、审计和发货包生成"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.0,<7", "PyMuPDF>=1.26,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ozon-ship = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

